# ==========================================================================
# Streamlit Community Cloud Secrets Template
#   - Paste the root-level keys into App settings > Secrets, then reboot
#     the app: settings are read once when the app starts.
#   - Root-level secrets become environment variables, which matches how
#     LISBOA reads credentials via os.getenv(...).
#   - Never commit the real .streamlit/secrets.toml file.
# ==========================================================================

# --------------------------------------------------------------------------
# Required
# --------------------------------------------------------------------------
# Hosted mode: temporary data directory, background data refresh, visitor
# model endpoints limited to public addresses.
LISBOA_HOSTED = "true"

# Server model (Azure OpenAI)
AZURE_OPENAI_API_KEY = "your_azure_key_here"
AZURE_OPENAI_ENDPOINT = "https://your-resource-name.openai.azure.com/"
AZURE_OPENAI_DEPLOYMENT_NAME = "your_deployment_name_here"

# Query embeddings on Cloudflare Workers AI (@cf/baai/bge-m3). The token needs
# the "Workers AI: Read" permission only. Without both values, semantic search
# is off and place searches use the catalogue fallback.
CLOUDFLARE_ACCOUNT_ID = "your_cloudflare_account_id_here"
CLOUDFLARE_API_TOKEN = "your_cloudflare_workers_ai_token_here"

# IPMA through the read-only relay: api.ipma.pt drops connections from some
# cloud hosts (docs/05_DEPLOYMENT_AND_OPERATIONS.md).
IPMA_BASE_URL = "https://ipma-relay.pages.dev"

# --------------------------------------------------------------------------
# Recommended
# --------------------------------------------------------------------------
# GitHub token for release downloads and freshness checks. Community Cloud
# apps share outbound IPs, so unauthenticated calls can hit the 60 per hour
# limit. Public releases need no token permissions.
VECTOR_DB_RELEASE_TOKEN = "your_github_read_token_here"

# --------------------------------------------------------------------------
# Optional
# --------------------------------------------------------------------------
# Metro de Lisboa official realtime API
METRO_CONSUMER_KEY = "your_metro_consumer_key_here"
METRO_CONSUMER_SECRET = "your_metro_consumer_secret_here"

# Tavily web search fallback
TAVILY_API_KEY = "your_tavily_api_key_here"

# LangSmith tracing
LANGSMITH_TRACING = "true"
LANGSMITH_API_KEY = "your_langsmith_api_key_here"
LANGSMITH_PROJECT = "my-thesis-project"
LANGSMITH_ENDPOINT = "https://eu.api.smith.langchain.com"
# LANGSMITH_WORKSPACE_ID = "your_langsmith_workspace_id_here"
# LANGSMITH_SYNC_FLUSH = "false"

# Server log detail; "true" only while debugging.
SHOW_MARKDOWN_RESPONSE_IN_TERMINAL = "false"
SHOW_DETAILED_EXECUTION_LOGS = "false"

# Defaults shown; set only to change them.
# LISBOA_DATA_REFRESH_HOURS = "6"
# LISBOA_EMBEDDINGS_BACKEND = "auto"
# LISBOA_ALLOW_VISITOR_LLM_SETTINGS = "true"
