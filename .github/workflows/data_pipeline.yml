# ==========================================================================
# Master Thesis - Automated Data Pipeline for VisitLisbon.pt (GitHub Actions)
#   - André Filipe Gomes Silvestre, 20240502
#
# GitHub Actions Workflow to automate data scraping and updating of JSON files
#
# Strategy:
#   1. Scrape Events data daily and commit it straight away
#   2. Scrape Places data weekly: when the last successful run is 7+ days old
#      (places_last_run.txt), so a failed run is retried the next day
#   3. Commit and push each dataset only when it changed
#
# A scraper aborts without saving when VisitLisboa returns too few results,
# so a transient block or timeout is retried before the job fails.
#
# Runtime (estimated):
#   - Events Scraper: ~8 minutes
#   - Places Scraper: ~60 minutes
# ==========================================================================

name: Update Lisbon Data

concurrency:
  group: update-lisbon-data-${{ github.ref }}
  cancel-in-progress: false

on:
  schedule:
    # Daily at 04:00 UTC (GitHub Actions cron schedules always run in UTC)
    # - Events: Every day
    # - Places: Weekly, from the date of the last successful run
    - cron: "0 4 * * *"

  # Allows manual run via GitHub "Run workflow" button
  workflow_dispatch:
    inputs:
      scrape_target:
        description: "Choose which VisitLisboa scraper to run manually"
        required: true
        default: both
        type: choice
        options:
          - events
          - places
          - both

permissions:
  contents: write

env:
  SCRAPER_ATTEMPTS: 3
  SCRAPER_RETRY_DELAY_SECONDS: 300

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache pip dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-webscraping-${{ hashFiles('requirements_github_action_webscraping.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-webscraping-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements_github_action_webscraping.txt ]; then pip install -r requirements_github_action_webscraping.txt; fi

      - name: Resolve Manual Selection
        id: manual_selection
        run: |
          TARGET="${{ github.event.inputs.scrape_target || 'both' }}"
          echo "scrape_target=$TARGET" >> $GITHUB_OUTPUT
          echo "🎛️ Manual selection: $TARGET"

      # 1. Run Events Script (Daily, or manually when requested)
      - name: Run Events Scraper
        id: events
        if: github.event_name != 'workflow_dispatch' || steps.manual_selection.outputs.scrape_target == 'events' || steps.manual_selection.outputs.scrape_target == 'both'
        run: |
          echo "Running Events Scraper..."
          for attempt in $(seq 1 "$SCRAPER_ATTEMPTS"); do
            python data_collection/webscraping/visitlisbon_events.py && exit 0
            if [ "$attempt" -lt "$SCRAPER_ATTEMPTS" ]; then
              echo "::warning::Events scraper failed (attempt $attempt/$SCRAPER_ATTEMPTS); retrying in ${SCRAPER_RETRY_DELAY_SECONDS}s"
              sleep "$SCRAPER_RETRY_DELAY_SECONDS"
            fi
          done
          echo "::error::Events scraper failed after $SCRAPER_ATTEMPTS attempts"
          exit 1

      - name: Commit Events Data
        if: steps.events.outcome == 'success'
        run: bash .github/scripts/commit_scraped_data.sh "Events"

      # 2. Run Places Script (weekly from the last successful run, or manually when requested)
      # Runs even when the Events scraper failed: the two datasets are independent
      - name: Check Places Age
        id: places_age
        if: ${{ !cancelled() }}
        run: |
          MARKER="data_collection/webscraping/places_last_run.txt"
          LAST=$(cat "$MARKER" 2>/dev/null || echo "1970-01-01")
          AGE_DAYS=$(( ( $(date -u +%s) - $(date -u -d "$LAST" +%s) ) / 86400 ))
          if [ "$AGE_DAYS" -ge 7 ]; then
            echo "due=true" >> $GITHUB_OUTPUT
            echo "📅 Last successful Places run: $LAST ($AGE_DAYS days ago) - Places will be scraped"
          else
            echo "due=false" >> $GITHUB_OUTPUT
            echo "📅 Last successful Places run: $LAST ($AGE_DAYS days ago) - Places scraper will be skipped"
          fi

      - name: Run Places Scraper
        id: places
        if: ${{ !cancelled() && ((github.event_name != 'workflow_dispatch' && steps.places_age.outputs.due == 'true') || (github.event_name == 'workflow_dispatch' && (steps.manual_selection.outputs.scrape_target == 'places' || steps.manual_selection.outputs.scrape_target == 'both'))) }}
        run: |
          echo "Running Places Scraper..."
          for attempt in $(seq 1 "$SCRAPER_ATTEMPTS"); do
            if python data_collection/webscraping/visitlisbon_places.py; then
              date -u +%F > data_collection/webscraping/places_last_run.txt
              exit 0
            fi
            if [ "$attempt" -lt "$SCRAPER_ATTEMPTS" ]; then
              echo "::warning::Places scraper failed (attempt $attempt/$SCRAPER_ATTEMPTS); retrying in ${SCRAPER_RETRY_DELAY_SECONDS}s"
              sleep "$SCRAPER_RETRY_DELAY_SECONDS"
            fi
          done
          echo "::error::Places scraper failed after $SCRAPER_ATTEMPTS attempts"
          exit 1

      # 3. Commit and push the Places data and its run marker
      - name: Commit Places Data
        if: ${{ !cancelled() && steps.places.outcome == 'success' }}
        run: bash .github/scripts/commit_scraped_data.sh "Places"
